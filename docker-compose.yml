services:
  # MinIO - S3-compatible object storage for Delta Lake
  minio:
    image: minio/minio:latest
    container_name: binance-minio
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create MinIO bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: binance-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/binance-data --ignore-existing;
      mc anonymous set download myminio/binance-data;
      echo 'MinIO bucket created successfully';
      "

volumes:
  minio-data:
    name: binance-minio-data
