[project]
name = "binance-tick-data"
version = "0.1.0"
description = "Binance tick data ingestion library using dlt"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.11.15",
    "dagster-webserver>=1.11.15",
    "dlt>=1.17.1",
    "duckdb>=1.4.1",
    "fracdiff>=0.9.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8",
    "numba>=0.60",
    "numpy>=1.26",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "plotly>=5.22",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "python-binance>=1.0.30",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "seaborn>=0.13.2",
]
redis = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_tick_data"]

[dependency-groups]
dev = [
    "fracdiff>=0.9.0",
    "pytest>=8.4.2",
    "seaborn>=0.13.2",
]

[project.scripts]
binance-download = "binance_tick_data.pipelines.historical_pipeline:main"
binance-download-safe = "binance_tick_data.pipelines.incremental_pipeline:main"
binance-stream = "binance_tick_data.pipelines.realtime_pipeline:main"
