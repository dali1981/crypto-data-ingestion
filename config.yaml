# Binance Tick Data Pipeline Configuration

database:
  db_path: "binance_pipeline.duckdb"
  schema_name: "binance_data"
  read_only: true

tables:
  agg_trades: "agg_trades"
  trades: "trades"
  klines: "klines"
  dollar_bars: "dollar_bars"

pipeline:
  default_batch_size: 10000

  # Dollar bar thresholds (in USD per bar)
  dollar_bar_thresholds:
    BTCUSDT: 1000000
    ETHUSDT: 500000
    default: 100000