# DLT Configuration
# Optimized for incremental updates with frequent writes

# DEFAULT/DEVELOPMENT CONFIGURATION
# Note: Files are written to destination only when pipeline.run() completes
[data_writer]
# buffer_max_items controls memory buffer size before flushing to temp staging files
# Smaller buffers = less memory usage, more frequent temp file writes
buffer_max_items = 10000    # Flush to temp files every 10K records (default: 5000)
file_max_items = 50000      # Parquet file size (max items per parquet file)

[normalize.data_writer]
buffer_max_items = 10000    # Normalize buffer matches extract buffer

[destination.filesystem]
bucket_url = "dev/data"     # Dev writes to dev/data directory

# PRODUCTION CONFIGURATION
# Larger buffers for better throughput and compression
[production.data_writer]
buffer_max_items = 100000   # Flush to temp files every 100K records
file_max_items = 500000     # Larger parquet files for better compression

[production.normalize.data_writer]
buffer_max_items = 100000   # Normalize buffer matches extract buffer

[production.destination.filesystem]
bucket_url = "data"         # Production writes to data directory
