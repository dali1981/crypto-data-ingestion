# DLT Configuration for Binance Tick Data
# Documentation: https://dlthub.com/docs/reference/configuration

[runtime]
# Log level for dlt operations
log_level = "INFO"

[normalize]
# Use Parquet for better compression and query performance
loader_file_format = "parquet"

[destination.duckdb]
# DuckDB configuration
# Database file path (relative to project root)
credentials = "dlt_binance.duckdb"

# DuckDB configuration options
[destination.duckdb.config]
# Enable Parquet support
threads = 4
max_memory = "2GB"

[destination.duckdb.credentials]
# Database location
database = "dlt_binance.duckdb"

# Alternative destinations (commented out)
# Uncomment and configure if you want to use a different destination

# [destination.postgres]
# credentials = "postgresql://user:password@localhost:5432/binance_data"

# [destination.bigquery]
# credentials.project_id = "your-project-id"
# credentials.dataset = "binance_tick_data"
# credentials.private_key = "path/to/service_account.json"

# [destination.snowflake]
# credentials.database = "binance_data"
# credentials.warehouse = "compute_wh"
# credentials.username = "your_username"
# credentials.password = "your_password"
# credentials.account = "your_account"

# Pipeline-specific configurations
[pipelines.binance_historical]
dataset_name = "binance_historical"

[pipelines.binance_realtime]
dataset_name = "binance_realtime"

# Source configurations
[sources.binance_tick_data]
# Binance API credentials (optional - for higher rate limits)
# Leave empty for public API access
api_key = ""
api_secret = ""

# Data collection settings
symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
historical_start_date = "2024-01-01"
stream_buffer_size = 100
